[package]
name = "bard-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "Bard's core: types, library scan, queue, config and stores"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
fastrand = "2.5.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
lofty = "0.25.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
sha1 = "0.11.0"
hmac = "0.13"
sha2 = "0.11"
unicode-normalization = "0.1.26"
uuid = { version = "1.29.2", features = ["v4"] }
walkdir = "2.5.0"

[dev-dependencies]
dirs = { version = "7.0.0", default-features = false }
image = { version = "0.25.10", default-features = false }
tempfile = "3.27.0"
