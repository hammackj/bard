[package]
name = "bard"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
description = "A local music player for streamers, with Content ID-aware streamer mode and an OBS overlay"

[dependencies]
bard-core = { path = "../bard-core" }
bard-audio = { path = "../bard-audio" }
bard-services = { path = "../bard-services" }
ctrlc = { version = "3", features = ["termination"] }
futures = "0.3"
unicode-segmentation = "1"
gpui = { package = "gpui-pre", version = "=0.3.12" }
# Wayland and X11 are opt-in: without them GPUI silently runs headless and
# no window ever reaches the screen.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = ["wayland", "x11"] }
gpui_wgpu = { package = "gpui-pre-wgpu", version = "=0.3.12", optional = true }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"

[target.'cfg(target_os = "linux")'.dependencies]
# Asking a running Bard to raise its window (MPRIS over the session bus).
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
# Raising the window with the activation token a tray click carries; GPUI has
# no way to take one after startup. The same versions GPUI links.
raw-window-handle = "0.6"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
# Only used when building for Windows (see build.rs).
embed-resource = "3"

[features]
# Headless rendering to PNG, for side-by-side comparison with the Electron UI.
snapshot = ["gpui/test-support", "gpui_platform/test-support", "dep:gpui_wgpu"]

[[bin]]
name = "bard"
path = "src/main.rs"

[[bin]]
name = "bard-snapshot"
path = "src/bin/snapshot.rs"
required-features = ["snapshot"]

# `cargo deb -p bard` (the release workflow runs it on Ubuntu 24.04, where
# $auto works out the library dependencies with dpkg-shlibdeps).
[package.metadata.deb]
name = "bard-player"
maintainer = "hammackj <172781+hammackj@users.noreply.github.com>"
copyright = "2026 hammackj"
license-file = ["../../LICENSE", "0"]
extended-description = """\
A local music player for streamers. Bard plays the files you point it at and \
nothing else. Streamer mode only plays albums you have marked safe for Content \
ID, and can arm itself when OBS goes live. Includes an OBS browser-source \
overlay, a tray icon and MPRIS. A Secret Service provider (KWallet, \
gnome-keyring or KeePassXC) is needed to keep the OBS WebSocket password."""
section = "sound"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/bard", "usr/bin/", "755"],
    ["../../resources/bard.desktop", "usr/share/applications/", "644"],
    ["../../resources/icon.svg", "usr/share/icons/hicolor/scalable/apps/bard.svg", "644"],
    ["../../resources/icons/icon-16.png", "usr/share/icons/hicolor/16x16/apps/bard.png", "644"],
    ["../../resources/icons/icon-22.png", "usr/share/icons/hicolor/22x22/apps/bard.png", "644"],
    ["../../resources/icons/icon-24.png", "usr/share/icons/hicolor/24x24/apps/bard.png", "644"],
    ["../../resources/icons/icon-32.png", "usr/share/icons/hicolor/32x32/apps/bard.png", "644"],
    ["../../resources/icons/icon-48.png", "usr/share/icons/hicolor/48x48/apps/bard.png", "644"],
    ["../../resources/icons/icon-64.png", "usr/share/icons/hicolor/64x64/apps/bard.png", "644"],
    ["../../resources/icons/icon-128.png", "usr/share/icons/hicolor/128x128/apps/bard.png", "644"],
    ["../../resources/icons/icon-256.png", "usr/share/icons/hicolor/256x256/apps/bard.png", "644"],
    ["../../resources/icons/icon-512.png", "usr/share/icons/hicolor/512x512/apps/bard.png", "644"],
    ["../../resources/icons/icon-1024.png", "usr/share/icons/hicolor/1024x1024/apps/bard.png", "644"],
    ["../../README.md", "usr/share/doc/bard-player/", "644"],
    ["../../THIRD-PARTY.md", "usr/share/doc/bard-player/", "644"],
]
