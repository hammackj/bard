name: Release

# Builds Bard for a version tag and publishes a GitHub Release with that
# version's CHANGELOG section as the notes:
#
# - Linux x86_64: a tarball and a .deb
# - macOS (Apple Silicon): Bard.app on a disk image, with an uninstaller
# - Windows x86_64: an installer (Inno Setup, with an uninstaller), and a
#   portable zip
#
# Runs on pushing a tag (vX.Y.Z), or by hand for a tag that already exists:
#   gh workflow run Release -f tag=v0.2.15
#
# A dry run builds and packages a branch without publishing; the packages
# are left as the run's artifacts:
#   gh workflow run Release --ref my-branch -f dry_run=true

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v0.2.15 (empty for a dry run of the branch)
        required: false
      dry_run:
        description: Build and package only; publish nothing
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag matches Cargo.toml and the CHANGELOG
        id: check
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run of $TAG at version $version"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::no CHANGELOG section for $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang libclang-dev \
            libpipewire-0.3-dev libspa-0.2-dev libopus-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libfontconfig-dev libfreetype-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Build
        run: |
          export BARD_COMMIT="$(git rev-parse --short HEAD)"
          cargo build --release --locked -p bard

      - name: Package
        run: |
          name="bard-$VERSION-x86_64-linux"
          mkdir -p "dist/$name/scripts" "dist/$name/resources"
          install -m 755 target/release/bard "dist/$name/bard"
          install -m 755 scripts/install-desktop.sh "dist/$name/scripts/"
          cp -r resources/icons resources/icon.svg resources/bard.desktop "dist/$name/resources/"
          cp README.md LICENSE THIRD-PARTY.md CHANGELOG.md "dist/$name/"
          mkdir "dist/$name/licenses"
          cp crates/bard/assets/fonts/LICENSE-*.txt crates/bard/assets/icons/LICENSE-*.txt "dist/$name/licenses/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -r "dist/$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - name: Debian package
        run: |
          cargo deb -p bard --no-build -o dist/
          deb="$(ls dist/*.deb)"
          # $auto fills Depends from the binary's linked libraries; an empty
          # field would install a package that cannot start.
          depends="$(dpkg-deb -f "$deb" Depends)"
          echo "Depends: $depends"
          if ! grep -q libpipewire <<<"$depends"; then
            echo "::error::$deb has no library dependencies"
            exit 1
          fi
          (cd dist && sha256sum "$(basename "$deb")" > "$(basename "$deb").sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          export BARD_COMMIT="$(git rev-parse --short HEAD)"
          cargo build --release --locked -p bard

      - name: Bundle Bard.app
        run: |
          app=dist/Bard.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          install -m 755 target/release/bard "$app/Contents/MacOS/bard"

          iconset="$RUNNER_TEMP/bard.iconset"
          mkdir -p "$iconset"
          for s in 16 32 128 256 512; do
            cp "resources/icons/icon-$s.png" "$iconset/icon_${s}x${s}.png"
            cp "resources/icons/icon-$((s * 2)).png" "$iconset/icon_${s}x${s}@2x.png"
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/bard.icns"

          # The fonts' and icons' licences travel with them.
          cp LICENSE THIRD-PARTY.md "$app/Contents/Resources/"
          mkdir "$app/Contents/Resources/licenses"
          cp crates/bard/assets/fonts/LICENSE-*.txt crates/bard/assets/icons/LICENSE-*.txt \
            "$app/Contents/Resources/licenses/"
          install -m 755 resources/macos/uninstall.command "$app/Contents/Resources/uninstall.command"

          sed "s/@VERSION@/$VERSION/g" resources/macos/Info.plist > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"

          # Not notarised: an ad-hoc signature only, which Apple Silicon
          # needs to run the binary at all.
          codesign --force --deep --sign - "$app"
          codesign --verify --verbose "$app"

      - name: Disk image
        run: |
          # What the window shows: the app, a shortcut to drag it onto, and
          # the uninstaller.
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage"
          cp -R dist/Bard.app "$stage/"
          ln -s /Applications "$stage/Applications"
          install -m 755 resources/macos/uninstall.command "$stage/Uninstall Bard.command"

          name="bard-$VERSION-aarch64-macos"
          hdiutil create -volname "Bard $VERSION" -srcfolder "$stage" \
            -fs HFS+ -format UDZO -ov "dist/$name.dmg"
          hdiutil verify "dist/$name.dmg"
          rm -r dist/Bard.app
          (cd dist && shasum -a 256 "$name.dmg" > "$name.dmg.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-2025
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          export BARD_COMMIT="$(git rev-parse --short HEAD)"
          cargo build --release --locked -p bard

      - name: Package
        run: |
          name="bard-$VERSION-x86_64-windows"
          mkdir -p "dist/$name"
          cp target/release/bard.exe README.md LICENSE THIRD-PARTY.md CHANGELOG.md "dist/$name/"
          mkdir "dist/$name/licenses"
          cp crates/bard/assets/fonts/LICENSE-*.txt crates/bard/assets/icons/LICENSE-*.txt "dist/$name/licenses/"
          (cd dist && 7z a -tzip "$name.zip" "$name" >/dev/null)
          (cd dist && sha256sum "$name.zip" > "$name.zip.sha256")
          echo "STAGE=dist/$name" >> "$GITHUB_ENV"

      - name: Installer
        run: |
          choco install innosetup --no-progress -y >/dev/null
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          "$iscc" -DAppVersion="$VERSION" -DStage="$(cygpath -w "$PWD/$STAGE")" \
            -O"$(cygpath -w "$PWD/dist")" resources/windows/bard.iss
          rm -r "$STAGE"
          setup="bard-$VERSION-x86_64-windows-setup.exe"
          test -f "dist/$setup"
          (cd dist && sha256sum "$setup" > "$setup.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [version, linux, macos, windows]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes from CHANGELOG
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ---

          ### Linux

          **Debian / Ubuntu 24.04 or newer:** download the `.deb` and run
          `sudo apt install ./bard-player_*_amd64.deb`.

          **Any other distro:** download `bard-*-x86_64-linux.tar.gz`, extract
          it, and from inside the folder run:

          ```bash
          install -Dm755 bard ~/.local/bin/bard
          ./scripts/install-desktop.sh ~/.local/bin/bard
          ```

          That adds a launcher and icons for your user. Bard needs PipeWire,
          and the `libpipewire`, `libopus` and `libxkbcommon` runtime
          libraries, which most desktops already have.

          ### macOS (Apple Silicon)

          Download `bard-*-aarch64-macos.dmg`, open it and drag **Bard** onto
          **Applications**. The app is not notarised, so the first time,
          right-click it and choose **Open**, or run
          `xattr -dr com.apple.quarantine /Applications/Bard.app`.
          To uninstall, run **Uninstall Bard** from the disk image (or
          `Bard.app/Contents/Resources/uninstall.command`).

          ### Windows

          Download `bard-*-x86_64-windows-setup.exe` and run it. It installs
          for your user without asking for admin rights, and Bard can be
          uninstalled from **Settings → Apps**. For a portable copy, extract
          `bard-*-x86_64-windows.zip` anywhere and run `bard.exe`. Neither is
          code-signed, so SmartScreen may ask you to confirm: **More info**,
          then **Run anyway**.

          **macOS and Windows support is experimental**, with no tray icon or
          media-key support yet. Please report problems at
          https://github.com/hammackj/bard/issues.
          EOF

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* \
              --title "Bard $VERSION" --notes-file notes.md --verify-tag
          fi
