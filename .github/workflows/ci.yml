name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Building on CI, not a dev checkout: keep warnings fatal everywhere.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang libclang-dev \
            libpipewire-0.3-dev libspa-0.2-dev libopus-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libfontconfig-dev libfreetype-dev \
            dbus

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --no-fail-fast

      # The release workflow builds the .deb from a release binary; a debug
      # build is enough to check the packaging still works and that $auto
      # finds the library dependencies.
      - name: Debian package
        run: |
          cargo build -p bard
          cargo deb -p bard --no-build --profile dev -o target/deb/
          deb="$(ls target/deb/*.deb)"
          depends="$(dpkg-deb -f "$deb" Depends)"
          echo "Depends: $depends"
          grep -q libpipewire <<<"$depends"
          dpkg-deb -c "$deb" | grep -q './usr/share/applications/bard.desktop'

  # macOS and Windows: the same lints and tests. No system packages needed;
  # libopus is built from source (CMake is on both runner images).
  native:
    name: clippy, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --no-fail-fast
