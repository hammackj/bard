<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    The concentric mark from the player's empty-artwork slot.

    Adapted rather than copied: the in-app version has four fine rings and
    eight radial lines, which turns to mush below about 48px. This keeps two
    heavy rings, four cardinal ticks and a solid centre, so the same idea
    survives a 16px tray slot.
  -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="70%">
      <stop offset="0%" stop-color="#0891B2" stop-opacity=".40"/>
      <stop offset="65%" stop-color="#0891B2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="#030712"/>
  <rect width="512" height="512" rx="114" fill="url(#glow)"/>
  <rect x="4" y="4" width="504" height="504" rx="110" fill="none" stroke="#1F2937" stroke-width="8"/>

  <g fill="none" stroke="#0891B2" stroke-linecap="round">
    <circle cx="256" cy="256" r="168" stroke-width="20"/>
    <circle cx="256" cy="256" r="104" stroke-width="18"/>
  </g>

  <!-- cardinal ticks: the crosshair, reduced to what still reads when tiny -->
  <g stroke="#22D3EE" stroke-width="20" stroke-linecap="round" stroke-opacity=".9">
    <path d="M256 40v52M256 420v52M40 256h52M420 256h52"/>
  </g>

  <circle cx="256" cy="256" r="40" fill="#22D3EE"/>
</svg>
