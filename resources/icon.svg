<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Bard's mark is the plucked string from the player UI.

    Designed down to 16px rather than up from 512: at tray size only about
    three shapes survive, so this is one bold arc, two anchors and one bead.
    An earlier version added vibration ghosts either side of the string; they
    merged into an unreadable blob below ~48px and were cut.
  -->
  <defs>
    <radialGradient id="glow" cx="40%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#0891B2" stop-opacity=".42"/>
      <stop offset="64%" stop-color="#0891B2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="42%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="#020617"/>
  <rect width="512" height="512" rx="114" fill="url(#glow)"/>
  <rect x="4" y="4" width="504" height="504" rx="110" fill="none" stroke="#1E293B" stroke-width="8"/>

  <!-- the string: deep enough that the curve still reads as a curve at 16px -->
  <path d="M96 336 Q256 112 416 336" fill="none" stroke="url(#wire)"
        stroke-width="34" stroke-linecap="round"/>

  <!-- anchors -->
  <circle cx="96" cy="336" r="26" fill="#0891B2"/>
  <circle cx="416" cy="336" r="26" fill="#0891B2"/>

  <!-- playhead, punched out of the string so it stays distinct when it blurs -->
  <circle cx="256" cy="194" r="60" fill="#020617"/>
  <circle cx="256" cy="194" r="38" fill="#22D3EE"/>
</svg>
