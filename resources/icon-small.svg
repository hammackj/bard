<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Small-size variant of the mark, used at 24px and below.
    One ring instead of two, with a larger centre. At tray sizes the second
    ring merges into the first and the whole thing reads as a blob, so this
    keeps the same idea with fewer strokes.
  -->
  <rect width="512" height="512" rx="114" fill="#030712"/>
  <rect x="4" y="4" width="504" height="504" rx="110" fill="none" stroke="#1F2937" stroke-width="8"/>

  <circle cx="256" cy="256" r="150" fill="none" stroke="#0891B2" stroke-width="34"/>

  <g stroke="#22D3EE" stroke-width="34" stroke-linecap="round">
    <path d="M256 34v58M256 420v58M34 256h58M420 256h58"/>
  </g>

  <circle cx="256" cy="256" r="62" fill="#22D3EE"/>
</svg>
